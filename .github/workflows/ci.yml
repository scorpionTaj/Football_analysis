name: Validate app

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: uv sync --extra dev --extra de --extra ml
      - name: Lint (pyflakes + pycodestyle errors)
        run: uvx ruff@0.14.0 check src tests
      - name: Unit, API and publish tests (local PostgreSQL via initdb)
        run: PATH="$(ls -d /usr/lib/postgresql/*/bin | tail -1):$PATH" uv run pytest -q
      - name: dbt warehouse build + data tests on fixture data
        run: ./scripts/ci_warehouse.sh
      - name: Dagster definitions load
        run: DAGSTER_HOME=$(mktemp -d) uv run dagster definitions validate -m football_analysis.orchestration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: API and scheduler image
        run: docker build -t football-api .
      - name: Web image
        run: docker build -t football-web frontend
      - name: API image starts as non-root and reports health
        run: |
          docker run -d --name api -p 8000:8000 football-api
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/v1/health
          test "$(docker exec api id -u)" != 0
