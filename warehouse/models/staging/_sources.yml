version: 2

sources:
  - name: app
    description: Tables written by the Python extractors (`football-sync`). Treated as the raw layer.
    schema: main
    tables:
      - name: matches
        description: Validated complete-season Football-Data results for the dashboard window.
      - name: recent_matches
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 48, period: hour}
      - name: recent_events
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 48, period: hour}
      - name: tournament_matches
      - name: ingestion_runs

  - name: landing
    description: Untouched files landed by `football-fetch-history` / `football-sync`.
    tables:
      - name: football_data_csv
        description: Every Football-Data season CSV, data/raw/<yyYY>/<league>.csv (2005+).
        config:
          external_location: >-
            read_csv('{{ env_var("FOOTBALL_DATA_DIR", "../data") }}/raw/[0-9][0-9][0-9][0-9]/*.csv', union_by_name = true,
            all_varchar = true, header = true, filename = true, null_padding = true)
