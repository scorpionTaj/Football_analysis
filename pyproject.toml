[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football_analysis"
version = "0.1.0"
description = "Free-source European football analytics"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.2,<2", "pandas>=2.2,<3", "plotly>=6,<7", "streamlit>=1.45,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
football-ingest = "football_analysis.ingest:main"

[tool.setuptools.package-data]
football_analysis = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
