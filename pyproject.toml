[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football_analysis"
version = "0.9.0"
description = "Free-source European football analytics"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "psycopg[binary]>=3.3.8",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "httpx2>=2.16.0"]
postgres = ["psycopg[binary]>=3.3.8"]
redis = ["redis>=8.1.0"]
de = ["dbt-duckdb>=1.11.1", "dagster>=1.13.29", "dagster-webserver>=1.13.29", "dagster-dbt>=0.29.29"]
ml = ["scikit-learn>=1.9.1", "lightgbm>=4.7.0", "mlflow>=3.18.0", "scipy>=1.18.1"]

[project.scripts]
football-ingest = "football_analysis.ingest:main"
football-sync-standings = "football_analysis.reference_standings:main"
football-refresh-analytics = "football_analysis.ingest:refresh_analytics_cache"
football-sync-recent = "football_analysis.recent:main"
football-sync-players = "football_analysis.players:main"
football-sync-open-players = "football_analysis.open_players:main"
football-sync-media = "football_analysis.media:main"
football-sync-tournaments = "football_analysis.tournaments:main"
football-sync-event-details = "football_analysis.event_details:main"
football-fetch-history = "football_analysis.history:main"
football-train-models = "football_analysis.ml.train:main"
football-publish = "football_analysis.publish:main"
football-build-warehouse = "football_analysis.warehouse:main"
football-sync = "football_analysis.pipeline:main"
football-api = "football_analysis.api.app:main"

[tool.setuptools.package-data]
football_analysis = ["schema.sql"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors; compact one-line statements and lambdas are house style.
ignore = ["E701", "E731", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
